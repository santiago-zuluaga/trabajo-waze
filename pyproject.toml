[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trabajo-waze"
version = "0.2.0"
description = "A* sobre OpenStreetMap con navegación Balanced por frecuencia histórica de siniestros en Medellín"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "geopandas>=1.0,<2",
    "geopy>=2.4,<3",
    "ipywidgets>=8.1,<9",
    "matplotlib>=3.8,<4",
    "networkx>=3.2,<4",
    "numpy>=1.26,<3",
    "osmnx>=2.0,<3",
    "pandas>=2.2,<4",
    "plotly>=5.24,<7",
    "pyproj>=3.6,<4",
    "requests>=2.32,<3",
    "scikit-learn>=1.4,<2",
    "shapely>=2.0,<3",
]

[project.optional-dependencies]
notebook = ["ipykernel>=6.29,<8", "jupyterlab>=4.2,<5"]
test = ["pytest>=8.0,<10"]

[tool.setuptools]
py-modules = ["waze_accidents", "waze_communes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
